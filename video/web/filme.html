<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>IPR Atlas · filme</title>
<link rel="stylesheet" href="maplibre-gl.css">
<style>
@font-face{font-family:Raleway;font-weight:300;src:url(raleway-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:Raleway;font-weight:400;src:url(raleway-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Raleway;font-weight:500;src:url(raleway-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Raleway;font-weight:600;src:url(raleway-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Raleway;font-weight:300;src:url(raleway-latin-ext-300-normal.woff2) format("woff2");unicode-range:U+0100-024F}
@font-face{font-family:Plex;font-weight:400;src:url(ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Plex;font-weight:500;src:url(ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
:root{--noite:#0e110b;--creme:#f1ead8;--ouro:#d9b45f;--musgo:#9bc53d;--agua:#6fb7d8}
html,body{margin:0;height:100%;background:var(--noite);overflow:hidden}
#mapa{position:fixed;inset:0}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}
#veu{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(13,16,11,.78) 0%,rgba(13,16,11,.38) 34%,rgba(13,16,11,0) 58%),linear-gradient(0deg,rgba(13,16,11,.6) 0%,rgba(13,16,11,0) 30%)}
.vert #veu{background:linear-gradient(0deg,rgba(13,16,11,.88) 0%,rgba(13,16,11,.55) 34%,rgba(13,16,11,0) 60%),linear-gradient(180deg,rgba(13,16,11,.5) 0%,rgba(13,16,11,0) 18%)}
#negro{position:fixed;inset:0;background:var(--noite);opacity:1;pointer-events:none}
#txt{position:fixed;left:7.2vw;bottom:15vh;max-width:46vw;color:var(--creme);font-family:Raleway,sans-serif}
.vert #txt{left:7vw;right:7vw;bottom:12vh;max-width:none}
#eyb{font:500 1.05vw/1.2 Plex,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--ouro);margin:0 0 1.6vh}
#tit{font-weight:300;font-size:4.3vw;line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
#tit em{font-style:normal;color:var(--ouro)}
#sub{font-weight:400;font-size:1.5vw;line-height:1.45;color:#d9d3c0;margin:2.2vh 0 0;max-width:36vw}
.vert #eyb{font-size:2.3vw}.vert #tit{font-size:8.6vw}.vert #sub{font-size:3.6vw;max-width:none}
#loc{position:fixed;right:3vw;bottom:4.2vh;font:400 .85vw/1.4 Plex,monospace;color:rgba(241,234,216,.72);text-align:right;letter-spacing:.04em}
.vert #loc{font-size:1.9vw;right:7vw;bottom:4vh}
#loc b{display:block;color:var(--creme);font-weight:500}
#marca{position:fixed;left:7.2vw;top:7vh;display:flex;align-items:center;gap:1vw;color:var(--creme);font-family:Raleway,sans-serif}
#marca img{width:3.2vw;height:3.2vw}
#marca b{display:block;font:500 1.05vw/1.2 Plex,monospace;letter-spacing:.2em;text-transform:uppercase}
#marca span{font-size:.95vw;color:#cfc8b3}
.vert #marca{left:7vw;top:5vh;gap:2.4vw}.vert #marca img{width:8vw;height:8vw}.vert #marca b{font-size:2.4vw}.vert #marca span{font-size:2.2vw}
#fim{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;color:var(--creme);font-family:Raleway,sans-serif;opacity:0;text-align:center}
#fim img{width:7vw;height:7vw}.vert #fim img{width:20vw;height:20vw}
#fim h2{font-weight:300;font-size:3.4vw;margin:0}.vert #fim h2{font-size:7.4vw;padding:0 8vw}
#fim p{margin:0;font:500 1.15vw/1.4 Plex,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--ouro)}.vert #fim p{font-size:2.6vw}
#fim .url{font:400 1.6vw/1.3 Plex,monospace;letter-spacing:.04em;text-transform:none;color:var(--creme)}.vert #fim .url{font-size:3.6vw}
#prod{display:flex;gap:1.2vw;margin-top:2.6vh;flex-wrap:wrap}
#prod span{font:500 .95vw/1 Plex,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--creme);border:1px solid rgba(217,180,95,.7);border-radius:999px;padding:1.1vh 1.1vw}
.vert #prod{gap:2vw}.vert #prod span{font-size:2.1vw;padding:1vh 2.6vw}
#cred{position:fixed;left:3vw;bottom:4.2vh;font:400 .75vw/1.4 Plex,monospace;color:rgba(241,234,216,.55)}
.vert #cred{display:none}
</style>
</head>
<body>
<div id="mapa"></div>
<div id="veu"></div>
<div id="marca"><img src="ipr-simbolo.png" alt=""><div><b>IPR Atlas</b><span id="marca-s"></span></div></div>
<div id="txt"><p id="eyb"></p><h1 id="tit"></h1><p id="sub"></p><div id="prod"></div></div>
<div id="loc"></div>
<div id="cred"></div>
<div id="fim"><img src="ipr-simbolo.png" alt=""><h2 id="fim-t"></h2><p id="fim-p"></p><p class="url">regenerativo.pt</p></div>
<div id="negro"></div>
<script src="maplibre-gl.js"></script>
<script src="contour.js"></script>
<script>
"use strict";
var Q=new URLSearchParams(location.search), LG=Q.get("lg")||"pt", VERT=Q.get("v")==="1";
if(VERT)document.documentElement.classList.add("vert");
// ?limpo=1 (Nuno, 02/11, 16h16: «só os planos 3D, sem palavras escritas nem logos»): só o relevo, sem véu, textos, marca nem passagens a negro
var LIMPO=Q.get("limpo")==="1";
if(LIMPO){var st=document.createElement("style");st.textContent="#veu,#txt,#loc,#marca,#cred,#fim,#negro{display:none!important}";document.head.appendChild(st);}
var DEM=location.origin.indexOf("filme.local")>=0?"https://terracruadesign.pt/ipr-relevo/{z}/{x}/{y}.webp":"https://terracruadesign.pt/ipr-relevo/{z}/{x}/{y}.webp";
var T={
 pt:{marca:"Instituto de Planeamento Regenerativo",cred:"Relevo: Mapterhorn (LiDAR DGT · PNOA-LiDAR · Copernicus GLO-30) · exagero vertical 1,6×",
  fimT:"Ler o território antes de o desenhar.",fimP:"IPR · Instituto de Planeamento Regenerativo",
  prod:["Base Cartográfica","Leitura Territorial","Planta de Localização"]},
 en:{marca:"Institute for Regenerative Planning",cred:"Relief: Mapterhorn (LiDAR DGT · PNOA-LiDAR · Copernicus GLO-30) · vertical exaggeration 1.6×",
  fimT:"Read the land before you design it.",fimP:"IPR · Institute for Regenerative Planning",
  prod:["Cartographic Base","Territorial Reading","Location Plan"]}
}[LG];
// Cenas: t0, t1 (s), câmara, rotação (graus/s), aproximação (zoom/s), textos e efeitos
var C=[
 {d:12,n:{pt:"Vale glaciar do Zêzere",en:"Zêzere glacial valley"},r:{pt:"Serra da Estrela",en:"Serra da Estrela"},c:[-7.592,40.318],z:12.3,p:72,b:196,rot:2.2,dz:.012,
  eyb:{pt:"IPR Atlas",en:"IPR Atlas"},tit:{pt:"Ler o território <em>antes</em> de o desenhar.",en:"Read the land <em>before</em> you design it."},sub:{pt:"",en:""}},
 {d:13,n:{pt:"Vale do Douro",en:"Douro valley"},r:{pt:"Pinhão, Alto Douro Vinhateiro",en:"Pinhão, Alto Douro wine region"},c:[-7.548,41.192],z:12.6,p:70,b:118,rot:2.0,dz:.01,
  eyb:{pt:"Relevo",en:"Relief"},tit:{pt:"Portugal inteiro em relevo, a partir do LiDAR.",en:"All of Portugal in relief, built from LiDAR."},sub:{pt:"O mesmo levantamento da DGT, ao metro, que usamos em cada projecto.",en:"The same national LiDAR survey, at one metre, that we use on every project."}},
 {d:14,n:{pt:"Serra do Gerês",en:"Gerês mountains"},r:{pt:"Peneda-Gerês",en:"Peneda-Gerês"},c:[-8.135,41.785],z:12.5,p:70,b:248,rot:1.8,dz:.008,cont:1,
  eyb:{pt:"Curvas de nível",en:"Contour lines"},tit:{pt:"Cada encosta, cada vale, medidos.",en:"Every slope and valley, measured."},sub:{pt:"Curvas de nível, declives e exposição solar, prontos a usar no desenho.",en:"Contours, slopes and solar aspect, ready to use in your design."}},
 {d:18,n:{pt:"Alto Mira",en:"Upper Mira"},r:{pt:"Santa Clara-a-Nova, Baixo Alentejo",en:"Santa Clara-a-Nova, Lower Alentejo"},c:[-8.170,37.515],z:13.4,p:66,b:160,rot:1.3,dz:.006,agua:1,
  eyb:{pt:"Água",en:"Water"},tit:{pt:"Para onde corre a água. Onde se junta. Até onde sobe.",en:"Where water runs. Where it gathers. How high it rises."},sub:{pt:"Linhas de água, bacias e zonas que podem inundar, terreno a terreno.",en:"Streams, catchments and flood-prone ground, plot by plot."}},
 {d:14,n:{pt:"Serra de Monchique",en:"Monchique hills"},r:{pt:"Fóia e Picota",en:"Fóia and Picota"},c:[-8.585,37.318],z:12.3,p:70,b:30,rot:1.6,dz:.008,sol:1,
  eyb:{pt:"Sol e sombra",en:"Sun and shade"},tit:{pt:"A luz que cada parcela recebe ao longo do dia.",en:"The light every plot receives through the day."},sub:{pt:"Para escolher onde plantar, onde construir, onde guardar a água.",en:"To choose where to plant, where to build, where to keep water."}},
 {d:15,n:{pt:"Serra da Arrábida",en:"Arrábida hills"},r:{pt:"Setúbal",en:"Setúbal"},c:[-8.985,38.478],z:12.6,p:68,b:330,rot:1.8,dz:.008,cont:1,
  eyb:{pt:"IPR Atlas",en:"IPR Atlas"},tit:{pt:"Mais de 100 camadas num só mapa.",en:"Over 100 layers in a single map."},sub:{pt:"Condicionantes, REN e RAN, solos, ocupação, fogo e água. Para todo o país.",en:"Planning constraints, soils, land cover, fire and water. Nationwide."}},
 {d:15,n:{pt:"Vale glaciar do Zêzere",en:"Zêzere glacial valley"},r:{pt:"Serra da Estrela",en:"Serra da Estrela"},c:[-7.62,40.36],z:11.9,p:74,b:150,rot:2.0,dz:.01,
  eyb:{pt:"IPR Cloud",en:"IPR Cloud"},tit:{pt:"Do mapa para o campo, sem perder nada.",en:"From the map to the field, nothing lost."},sub:{pt:"O projecto no QGIS e no telemóvel com o QField, sempre sincronizado na IPR Cloud.",en:"Your project in QGIS and on your phone with QField, always in sync on IPR Cloud."}},
 {d:13,n:{pt:"Vale do Douro",en:"Douro valley"},r:{pt:"Pinhão, Alto Douro Vinhateiro",en:"Pinhão, Alto Douro wine region"},c:[-7.50,41.17],z:12.2,p:72,b:60,rot:1.6,dz:.006,prod:1,
  eyb:{pt:"Para o seu terreno",en:"For your land"},tit:{pt:"Procure o terreno. Veja o que ele permite.",en:"Find your land. See what it allows."},sub:{pt:"Leitura grátis no mapa; depois, o documento de que precisa.",en:"A free reading on the map; then the document you need."}},
 {d:8,fim:1,c:[-7.592,40.318],z:11.6,p:60,b:210,rot:1.2,dz:0}
];
var t=0;C.forEach(function(s){s.t0=t;t+=s.d;s.t1=t;});var DUR=t;
function cena(tt){for(var i=0;i<C.length;i++){if(tt<C[i].t1)return i;}return C.length-1;}
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
var el=function(i){return document.getElementById(i);};
el("marca-s").textContent=T.marca;el("cred").textContent=T.cred;el("fim-t").textContent=T.fimT;el("fim-p").textContent=T.fimP;
el("prod").innerHTML=T.prod.map(function(p){return "<span>"+p+"</span>";}).join("");
var demSrc=new mlcontour.DemSource({url:DEM,encoding:"terrarium",maxzoom:14,worker:true});
demSrc.setupMaplibre(maplibregl);
var RAMPA=["interpolate",["linear"],["elevation"],-20,"#16303d",0,"#1d3c47",1,"#2f5b3c",60,"#3f6e43",150,"#5f8a4a",300,"#97a35a",450,"#c7b46a",650,"#d8a861",850,"#c58650",1100,"#a8623f",1400,"#8a4f3a",1700,"#7d5a4c",1900,"#b9aea3",2000,"#ece8e1"];
var m=new maplibregl.Map({container:"mapa",interactive:false,attributionControl:false,fadeDuration:0,maxPitch:80,preserveDrawingBuffer:true,
 center:C[0].c,zoom:C[0].z,pitch:C[0].p,bearing:C[0].b,pixelRatio:1,
 style:{version:8,
  sources:{dem:{type:"raster-dem",tiles:[DEM],encoding:"terrarium",tileSize:512,maxzoom:14},
   sh:{type:"raster-dem",tiles:[DEM],encoding:"terrarium",tileSize:512,maxzoom:14},
   cn:{type:"vector",tiles:[demSrc.contourProtocolUrl({thresholds:{11:[50,250],12:[50,250]},elevationKey:"ele",levelKey:"level",contourLayer:"c"})],maxzoom:12}},
  sky:{"sky-color":"#33414c","horizon-color":"#b9b39a","fog-color":"#4a4a3c","sky-horizon-blend":.5,"horizon-fog-blend":.6,"fog-ground-blend":.25},
  terrain:{source:"dem",exaggeration:1.6},
  layers:[
   {id:"fundo",type:"background",paint:{"background-color":"#1a2a30"}},
   {id:"cor",type:"color-relief",source:"sh",paint:{"color-relief-opacity":1,"color-relief-color":RAMPA}},
   {id:"agua",type:"color-relief",source:"sh",paint:{"color-relief-opacity":0,"color-relief-color":["interpolate",["linear"],["elevation"],0,"rgba(80,170,215,0.9)",1,"rgba(0,0,0,0)"]}},
   {id:"sombra",type:"hillshade",source:"sh",paint:{"hillshade-exaggeration":.55,"hillshade-shadow-color":"#0e120b","hillshade-highlight-color":"#fff6dc","hillshade-accent-color":"#2a2a1e","hillshade-illumination-direction":315,"hillshade-illumination-anchor":"map"}},
   {id:"curvas",type:"line",source:"cn","source-layer":"c",paint:{"line-color":"rgba(255,246,220,0.75)","line-opacity":0,"line-width":["match",["get","level"],1,1.4,0.6]}}
  ]}});
m.on("error",function(e){console.log("MAPERR",e&&e.error&&e.error.message);});
var nivelBase={};
function hBase(i,s){if(nivelBase[i]!=null)return nivelBase[i];try{var h=m.queryTerrainElevation(s.c);if(h!=null&&isFinite(h)){nivelBase[i]=h/1.6;return nivelBase[i];}}catch(e){}return 150;}
function txt(s){var L=function(o){return o?o[LG]:"";};
 el("eyb").textContent=L(s.eyb);el("tit").innerHTML=L(s.tit);el("sub").textContent=L(s.sub);el("sub").style.display=L(s.sub)?"":"none";
 el("prod").style.display=s.prod?"flex":"none";
 el("loc").innerHTML=s.n?"<b>"+L(s.n)+"</b>"+L(s.r)+" · "+Math.abs(s.c[1]).toFixed(3)+"° N · "+Math.abs(s.c[0]).toFixed(3)+"° W":"";}
var ultima=-1;
window.estado=function(tt){
 var i=cena(tt),s=C[i],lt=tt-s.t0;
 if(i!==ultima){txt(s);ultima=i;}
 // entrada de cada cena: a câmara chega de mais alto e mais deitada e assenta em 3,5 s (abertura: 6 s, desde muito alto)
 var dur=i===0?6.5:3.5, k=1-Math.pow(1-Math.min(1,lt/dur),3), dz0=i===0?3.4:0.9, dp0=i===0?40:16;
 var zz=s.z+(VERT?-0.35:0)+s.dz*lt-(1-k)*dz0, pp=(VERT?Math.max(55,s.p-8):s.p)-(1-k)*dp0;
 var giro=s.b+s.rot*lt-(1-k)*(i===0?70:28); // roda mais depressa à chegada
 m.jumpTo({center:s.c,zoom:zz,pitch:pp,bearing:giro});
 // passagens: negro a entrar e a sair de cada cena
 var fade=Math.max(1-ease(lt/0.9), ease((lt-(s.d-0.9))/0.9));
 if(i===0)fade=Math.max(1-ease((lt-0.3)/1.6),ease((lt-(s.d-0.9))/0.9));
 el("negro").style.opacity=s.fim?Math.max(0.35,1-ease(lt/1.2))*(lt<1.2?1:0)+0.0:fade;
 if(s.fim){el("negro").style.opacity=String(1-ease(lt/1.0)*0.45);}
 // textos: entram 1,0 s depois do início, saem 1,2 s antes do fim
 var a=ease((lt-1.0)/0.8)*(1-ease((lt-(s.d-1.4))/0.6));
 el("txt").style.opacity=s.fim?0:a;el("txt").style.transform="translateY("+((1-ease((lt-1.0)/0.8))*14)+"px)";
 el("loc").style.opacity=s.fim?0:a*0.9;
 el("marca").style.opacity=(i===0||s.fim)?0:1;el("cred").style.opacity=s.fim?0:1;
 el("fim").style.opacity=s.fim?ease((lt-0.8)/1.0):0;
 // curvas de nível
 m.setPaintProperty("curvas","line-opacity",s.cont?ease((lt-2)/2.0)*0.9:0);
 // sol: a luz roda 220 graus ao longo da cena
 m.setPaintProperty("sombra","hillshade-illumination-direction",s.sol?(80+lt/s.d*220)%360:315);
 m.setPaintProperty("sombra","hillshade-exaggeration",s.sol?0.85:0.55);
 // água a subir: do fundo do vale até 45 m acima
 if(s.agua){var h0=hBase(i,s)-6,nv=h0+ease((lt-2)/(s.d-4))*45;
  m.setPaintProperty("agua","color-relief-color",["interpolate",["linear"],["elevation"],nv-60,"rgba(40,120,175,0.92)",nv-1,"rgba(90,180,220,0.85)",nv,"rgba(0,0,0,0)"]);
  m.setPaintProperty("agua","color-relief-opacity",ease((lt-1.5)/1.5));}
 else m.setPaintProperty("agua","color-relief-opacity",0);
};
window.pronto=function(){return new Promise(function(res){
 var feito=false,to=setTimeout(function(){feito=true;res("tempo");},20000);
 function ve(){if(feito)return;if(m.loaded()&&m.areTilesLoaded()){feito=true;clearTimeout(to);requestAnimationFrame(function(){requestAnimationFrame(function(){res("ok");});});}else setTimeout(ve,60);}
 m.triggerRepaint();setTimeout(ve,30);});};
window.DUR=DUR;
window.inicio=new Promise(function(res){m.once("load",function(){res();});});
</script>
</body>
</html>
