# IPR Atlas · cópia rápida das colecções grandes da DGT (Nuno, 25/11/2026 13h06: «não consegues acelerar isto? não pares»).
# Cada colecção é partida em fatias; cada fatia corre numa máquina com IP próprio (a DGT limita por IP). No fim junta-se tudo,
# faz-se o PMTiles (tippecanoe), publica-se na versão «dgt-pmtiles» e o Worker ipr-copia-ficheiro copia-o para o R2
# (pmtiles/dgt/<colecção>.pmtiles). O dgt-proprio.js do Atlas passa a servir dele assim que existe. Dados abertos DGT, CC BY 4.0.
name: dados-dgt-rapido
on:
  workflow_dispatch:
    inputs:
      cols: { description: "colecções (vírgulas)", default: "cadastro,cos2025v1,cos2018v4,srup_perigosidade_inc_rural,cos2018v3,altimetria_curvas_nivel,altimetria_pontos" }
      fatias: { description: "fatias por colecção", default: "8" }
permissions:
  contents: write
jobs:
  plano:
    runs-on: ubuntu-24.04
    outputs:
      m: ${{ steps.m.outputs.m }}
      c: ${{ steps.m.outputs.c }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          cols = [c.strip() for c in "${{ github.event.inputs.cols }}".split(",") if c.strip()]
          n = int("${{ github.event.inputs.fatias }}")
          m = [{"col": c, "modo": "freguesias" if c == "cadastro" else "grelha", "i": i, "n": n} for c in cols for i in range(n)]
          print("m=" + json.dumps({"include": m}))
          print("c=" + json.dumps(cols))
          PY
  copiar:
    needs: plano
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plano.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 ferramentas/dgt_partes_gh.py ${{ matrix.col }} ${{ matrix.modo }} ${{ matrix.i }} ${{ matrix.n }} parte.geojsons && gzip -1 parte.geojsons && ls -la
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.col }}-${{ matrix.i }}", path: parte.geojsons.gz, retention-days: 5 }
  pmtiles:
    needs: [plano, copiar]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        col: ${{ fromJson(needs.plano.outputs.c) }}
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "${{ matrix.col }}-*", path: /tmp/p }
      - name: Ferramentas
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq tippecanoe; then
            sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
            git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tc && make -C /tmp/tc -j4 && sudo make -C /tmp/tc install
          fi
          sudo mkdir -p /mnt/d && sudo chown $USER /mnt/d
      - name: Juntar sem repetidos
        run: |
          python3 - <<'PY'
          import glob, gzip, json
          vistos, n = set(), 0
          with open("/mnt/d/c.geojsons", "w") as o:
              for f in sorted(glob.glob("/tmp/p/*/parte.geojsons.gz")):
                  for l in gzip.open(f, "rt"):
                      try: k = json.loads(l).get("id")
                      except Exception: continue
                      if k is not None and k in vistos: continue
                      if k is not None: vistos.add(k)
                      o.write(l); n += 1
          print("elementos:", n)
          PY
      - name: PMTiles
        run: |
          cd /mnt/d; C=${{ matrix.col }}
          case $C in altimetria_pontos) Z=14; O="-r1 --drop-densest-as-needed";; altimetria_curvas_nivel) Z=14; O="--drop-densest-as-needed --extend-zooms-if-still-dropping";; *) Z=14; O="--coalesce-densest-as-needed --detect-shared-borders --simplify-only-low-zooms --extend-zooms-if-still-dropping";; esac
          for z in $Z $((Z-1)) $((Z-2)); do
            tippecanoe -o $C.pmtiles -l $C -n "$C (DGT)" -A "DGT · $C · CC BY 4.0 · cópia IPR Atlas" -Z5 -z$z $O --hilbert -P -t /mnt/d --force c.geojsons
            S=$(stat -c %s $C.pmtiles); echo "z$z: $S"; [ $S -lt 500000000 ] && break
          done
      - name: Publicar e copiar para o R2
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd /mnt/d; C=${{ matrix.col }}
          gh release view dgt-pmtiles --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create dgt-pmtiles --repo "$GITHUB_REPOSITORY" --title "Colecções da DGT em PMTiles (CC BY 4.0)" --notes "Cópia IPR Atlas" || true
          gh release upload dgt-pmtiles $C.pmtiles --repo "$GITHUB_REPOSITORY" --clobber
          sleep 20
          curl -sS --max-time 900 "https://ipr-copia-ficheiro.terracrua-ipr.workers.dev/?f=$C&ir=1" || true
