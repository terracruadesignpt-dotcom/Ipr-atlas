# IPR Atlas · cópia nacional das plantas do PDM publicadas no SNIT da DGT (Nuno, 17/11/2026, 11h31: «As plantas do PDM é a coisa
# mais importante [...] Copia essa merda»). Cada volta: lista as câmaras com PDM no SNIT, tira as já feitas (há <dico>.tar na
# versão snit-<distrito>) e reparte o resto por grupos. Cada câmara feita é publicada logo e entra no R2 tcd-camadas em snit/.
# Corre de 6 em 6 horas até acabar; as câmaras que falharem voltam na volta seguinte.
name: dados-snit-pdm
on:
  workflow_dispatch:
    inputs:
      camaras: { description: "DICO ou prefixos separados por vírgulas (vazio = todas)", default: "" }
      grupos: { description: "número de grupos em paralelo", default: "12" }
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: write
concurrency: { group: dados-snit-pdm, cancel-in-progress: false }
jobs:
  lista:
    runs-on: ubuntu-24.04
    outputs:
      grupos: ${{ steps.g.outputs.grupos }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow pmtiles
      - name: Câmaras com PDM no SNIT
        run: python3 ferramentas/snit_pdm.py lista lista.json
      - name: Tirar as feitas e repartir
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -L 100 --json tagName -q '.[].tagName' | grep '^snit-' | while read t; do gh release view "$t" --json assets -q '.assets[].name'; done > anexos.txt || true
          grep '\.tar$' anexos.txt | sed 's/\.tar$//' > feitos.txt || true
          grep '\.pmtiles$' anexos.txt > plantas.txt || true   # 24/11: plantas já copiadas não se repetem
          echo "plantas já copiadas: $(wc -l < plantas.txt)"
          echo "feitas: $(wc -l < feitos.txt)"
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          l = json.load(open('lista.json')); f = set(open('feitos.txt').read().split())
          pre = [p.strip() for p in "${{ github.event.inputs.camaras }}".split(',') if p.strip()]
          falta = [d for d in l if d not in f and (not pre or any(d.startswith(p) for p in pre))]
          n = max(1, min(int("${{ github.event.inputs.grupos || '12' }}"), len(falta)))
          g = [','.join(falta[i::n]) for i in range(n)] if falta else []
          print('câmaras por fazer:', len(falta), file=__import__('sys').stderr)
          print('grupos=' + json.dumps(g))
          PY
      - uses: actions/upload-artifact@v4
        with: { name: lista, path: "lista.json\nfeitos.txt\nplantas.txt" }
  copiar:
    needs: lista
    if: needs.lista.outputs.grupos != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        g: ${{ fromJson(needs.lista.outputs.grupos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: lista }
      - run: pip install -q pillow pmtiles && sudo mkdir -p /mnt/d && sudo chown $USER /mnt/d
      - name: Copiar do SNIT e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # 24/11/2026: o publicar corre em /mnt/d, fora do repositório; sem isto o gh falhava e nada era publicado
          SNIT_DEPOIS: ${{ github.workspace }}/ferramentas/snit_publicar.sh
          SNIT_FIOS: "2"   # 24/11: com 13 grupos × 3 o SNIT deixava de responder (timeouts em série)
        run: python3 ferramentas/snit_pdm.py copiar lista.json "${{ matrix.g }}" /mnt/d 330 feitos.txt plantas.txt
