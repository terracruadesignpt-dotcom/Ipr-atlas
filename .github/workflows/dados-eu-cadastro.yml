name: dados-eu-cadastro
# Cadastro europeu em dados abertos: França, Chéquia, Países Baixos, Luxemburgo e Espanha. Terracrua Design, IPR Atlas.
# 26/11/2026: cada fatia faz os seus PMTiles (um por departamento, província ou fatia), publica-os em eu-<país>-pmtiles e
# pede a cópia para o R2. Já não se junta o país inteiro num ficheiro (passaria dos 2 GB que as versões aceitam).
on:
  workflow_dispatch:
    inputs:
      paises: {description: "países (json)", default: '["es","fr","cz","nl","lu"]'}
permissions: {contents: write}
jobs:
  partes:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pais: ${{ fromJSON(github.event.inputs.paises || '["es","fr","cz","nl","lu"]') }}
        fatia: [0,1,2,3,4,5,6,7]
    env: {GH_TOKEN: "${{ github.token }}", EU_ENTREGAR: "1"}
    steps:
      - uses: actions/checkout@v4
      - name: ferramentas
        run: |
          if [ "${{ matrix.pais }}" = "nl" ] || [ "${{ matrix.pais }}" = "lu" ]; then [ "${{ matrix.fatia }}" = "0" ] || exit 0; fi
          sudo apt-get -qq update && sudo apt-get -qq install -y gdal-bin >/dev/null
          if ! sudo apt-get -qq install -y tippecanoe >/dev/null; then
            sudo apt-get -qq install -y build-essential libsqlite3-dev zlib1g-dev >/dev/null
            git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tc && make -C /tmp/tc -j4 >/dev/null && sudo make -C /tmp/tc install >/dev/null
          fi
      - name: descarregar e entregar
        run: |
          if [ "${{ matrix.pais }}" = "nl" ] || [ "${{ matrix.pais }}" = "lu" ]; then [ "${{ matrix.fatia }}" = "0" ] || { echo "só fatia 0"; exit 0; }; fi
          sudo mkdir -p /mnt/eu && sudo chown $USER /mnt/eu
          RUNNER_TEMP=/mnt/eu python3 -I ferramentas/eu_cadastro.py ${{ matrix.pais }} ${{ matrix.fatia }} 8 /mnt/eu/out
